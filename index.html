<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LogiRotator - Gestão Logística por Setor</title>
    
    <!-- Configurações para PWA / Smartphone -->
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LogiRotator">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23f59e0b'/><path d='M130 180 L60 256 L130 332 M382 180 L452 256 L382 332 M275 140 L235 372' stroke='%2309090b' stroke-width='48' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23f59e0b'/><path d='M130 180 L60 256 L130 332 M382 180 L452 256 L382 332 M275 140 L235 372' stroke='%2309090b' stroke-width='48' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22LogiRotator%22%2C%22short_name%22%3A%22LogiRotator%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%2309090b%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%2520512%2520512%2527%253E%253Crect%2520width%253D%2527512%2527%2520height%253D%2527512%2527%2520rx%253D%2527120%2527%2520fill%253D%2527%2523f59e0b%2527%2F%253E%253Cpath%2520d%253D%2527M130%2520180%2520L60%2520256%2520L130%2520332%2520M382%2520180%2520L452%2520256%2520L382%2520332%2520M275%2520140%2520L235%2520372%2527%2520stroke%253D%2527%252309090b%2527%2520stroke-width%253D%252748%2527%2520stroke-linecap%253D%2527round%2527%2520stroke-linejoin%253D%2527round%2527%2520fill%253D%2527none%2527%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-12">
    <div id="app" class="max-w-md md:max-w-6xl mx-auto p-3 sm:p-6">
        <!-- Header -->
        <header class="flex flex-col gap-4 mb-6 pb-4 border-b border-slate-800">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="bg-amber-500/10 p-2 rounded-xl border border-amber-500/30 text-amber-400">
                        <i data-lucide="layers" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-amber-400">LogiRotator</h1>
                        <p id="label-mes-ano" class="text-xs text-slate-400">A carregar calendário...</p>
                    </div>
                </div>
                <button onclick="abrirModalAdd()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-2.5 sm:px-4 sm:py-2.5 rounded-xl flex items-center gap-2 shadow-lg transition active:scale-95">
                    <i data-lucide="user-plus" class="w-5 h-5"></i>
                    <span class="hidden sm:inline text-sm">Novo Auxiliar</span>
                </button>
            </div>
        </header>

        <!-- KPI / Resumo Geral -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-xl shadow-md flex items-center justify-between">
                <div>
                    <span class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400">Auxiliares</span>
                    <h2 id="kpi-total" class="text-2xl font-extrabold text-slate-100 mt-0.5">0</h2>
                </div>
                <div class="bg-blue-500/10 p-2.5 rounded-lg border border-blue-500/20 text-blue-400">
                    <i data-lucide="users" class="w-5 h-5"></i>
                </div>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-xl shadow-md flex items-center justify-between">
                <div>
                    <span class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400">Em Alerta (+7d)</span>
                    <h2 id="kpi-alertas" class="text-2xl font-extrabold text-red-400 mt-0.5">0</h2>
                </div>
                <div class="bg-red-500/10 p-2.5 rounded-lg border border-red-500/20 text-red-400">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                </div>
            </div>
        </div>

        <!-- Busca e Grade Completa -->
        <div class="bg-slate-900/50 border border-slate-800 p-3 rounded-xl mb-6 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative w-full">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                <input type="text" id="input-busca" placeholder="Pesquisar auxiliar..." oninput="filtrarColaboradores()" class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition">
            </div>
            <div class="w-full sm:w-auto flex justify-end">
                <button onclick="abrirModalMatriz()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs sm:text-sm px-4 py-2 rounded-lg border border-slate-700 flex items-center justify-center gap-2 shadow transition">
                    <i data-lucide="grid" class="w-4 h-4 text-amber-400"></i>
                    <span>Ver Grade Mensal</span>
                </button>
            </div>
        </div>

        <!-- Tela Principal Dividida nos 11 Setores -->
        <div id="container-setores" class="space-y-6"></div>
    </div>

    <!-- Modal Adicionar / Editar Colaborador -->
    <div id="modal-add" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-titulo" class="text-base font-bold text-amber-400 flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> Adicionar Auxiliar
                </h3>
                <button onclick="fecharModalAdd()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-3">
                <input type="hidden" id="edit-id" value="">
                
                <!-- Seleção de Nome (Lista Teste 70 colaboradores) -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Selecionar da Lista Teste</label>
                    <select id="select-nome-teste" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-amber-500"></select>
                </div>

                <!-- Seleção de Função (Setores) -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Função / Setor</label>
                    <select id="novo-funcao" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-amber-500"></select>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button onclick="fecharModalAdd()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-3.5 py-2 rounded-xl text-xs transition">Cancelar</button>
                    <button onclick="salvarColaborador()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Matriz Mensal Única -->
    <div id="modal-matriz" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-2 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-6xl w-full h-[90vh] flex flex-col p-4 sm:p-6 shadow-2xl">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <div>
                    <h3 id="titulo-matriz-mes" class="text-sm sm:text-lg font-bold text-amber-400 flex items-center gap-2">
                        <i data-lucide="grid" class="w-5 h-5"></i> Matriz Mensal Completa
                    </h3>
                    <p class="text-[11px] text-slate-400">Todos os colaboradores e dias do mês em uma única tabela. Dia atual em destaque fixo (⭐).</p>
                </div>
                <button onclick="fecharModalMatriz()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="flex-grow overflow-auto my-3 relative rounded-lg border border-slate-800">
                <table id="tabela-matriz-unica" class="w-full text-left border-collapse text-xs"></table>
            </div>

            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="fecharModalMatriz()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-4 py-2 rounded-xl text-xs transition">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal Editar Histórico -->
    <div id="modal-historico" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div>
                    <h3 id="titulo-modal-hist" class="text-sm sm:text-base font-bold text-amber-400">Editar Histórico</h3>
                    <p class="text-[11px] text-slate-400">O dia atual fica fixo no topo para edição rápida.</p>
                </div>
                <button onclick="fecharModalHistorico()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="conteudo-historico-dias" class="max-h-[55vh] overflow-y-auto space-y-2 pr-1"></div>
            <div class="flex justify-end pt-3 border-t border-slate-800 mt-3">
                <button onclick="fecharModalHistorico()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition">Concluir</button>
            </div>
        </div>
    </div>

    <script>
        const SETORES_E_FUNCOES = {
            "Recebimento": ["Bipador Recebimento", "Patoleiro"],
            "Bancada de Triagem Fly / XPT": ["Abastecedor Triagem", "Sorting Triagem Fly"],
            "Triagem de Volumoso XPT / LM": ["Bipador Vol XPT", "Sorting Triagem Vol"],
            "Sorting 1 Volumoso LM": ["Bipador Volumoso LM", "Sorting 1 Volumoso LM"],
            "Sorting 1 Fly LM": ["Abastecedor Fly LM", "Bipador Fly LM", "Etequitador", "Sorting 1 Fly LM"],
            "Sorting 2 LM": ["Sorting 2 LM"],
            "XPT Fly": ["Bipador XPT Fly", "Abastecedor XPT Fly"],
            "Expedição XPT": ["Bipador Expedição XPT", "Gaioleiro Expedição"],
            "Inventário": ["Aux Inventário"],
            "Flip": ["Aux Flip"],
            "FM": ["Aux FM"]
        };

        let FUNCOES_LOGISTICA = [];
        Object.values(SETORES_E_FUNCOES).forEach(lista => {
            FUNCOES_LOGISTICA.push(...lista);
        });

        const LISTA_TESTE_70_NOMES = [
            "Alice Souza", "Bruno Lima", "Carlos Silva", "Daniela Rocha", "Eduardo Santos", "Fernanda Costa", "Gabriel Alves", "Helena Martins", "Igor Ribeiro", "Juliana Mendes",
            "Kleber Pereira", "Larissa Farias", "Marcos Vinicius", "Natalia Cardoso", "Otavio Medeiros", "Patricia Ramos", "Quintino Dias", "Rafaela Araujo", "Samuel Moreira", "Tatiane Barbosa",
            "Ubiratan Cruz", "Vanessa Lima", "Wagner Nunes", "Ximena Torres", "Yago Pires", "Zuleica Freitas", "Alexandre Magno", "Bianca Oliveira", "Caio Vinicius", "Debora Duarte",
            "Erickson Silva", "Flavia Guedes", "Gilberto Gil", "Humberto Junior", "Isabela Bicalho", "Jonas Brothers", "Karina Bacchi", "Leandro Hassum", "Mariana Rios", "Nelson Rodrigues",
            "Osvaldo Cruz", "Priscilla Alcantara", "Queila Miranda", "Renato Russo", "Simone Mendes", "Ticiane Pinheiro", "Uelinton Souza", "Viviane Araujo", "Wesley Safadao", "Xuxa Meneghel",
            "Yuri Alberto", "Zeca Pagodinho", "Amanda Schunk", "Bernardo Veloso", "Camila Pitanga", "Diego Hypolito", "Eliana Michaelichen", "Fagner Conserva", "Gisele Bundchen", "Hugo Gloss",
            "Iza Cantora", "Jojo Todynho", "Kaka Ricardinho", "Lucas Lucco", "Marcelo D2", "Neymar Junior", "Paolla Oliveira", "Richarlison Pombo", "Sabrina Sato", "Thiago Silva"
        ];

        const dataAtualSistema = new Date();
        const anoAtual = dataAtualSistema.getFullYear();
        const mesAtualIndex = dataAtualSistema.getMonth();
        const diaHoje = dataAtualSistema.getDate();
        
        function obterTotalDiasMes(ano, mes) {
            return new Date(ano, mes + 1, 0).getDate();
        }
        const totalDiasDoMes = obterTotalDiasMes(anoAtual, mesAtualIndex);

        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        const nomeMesAtual = nomesMeses[mesAtualIndex];
        const SENHA_ADM = "admin123";

        let colaboradores = [];
        LISTA_TESTE_70_NOMES.forEach((nome, index) => {
            const funcAleatoria = FUNCOES_LOGISTICA[index % FUNCOES_LOGISTICA.length];
            colaboradores.push({
                id: 1000 + index,
                nome: nome,
                dataCriacao: "01/09/2026",
                historicoDias: [funcAleatoria]
            });
        });

        function init() {
            document.getElementById('label-mes-ano').innerText = `Escala de ${nomeMesAtual} / ${anoAtual} (Hoje: Dia ${diaHoje} ⭐)`;
            popularSelectNomesTeste();
            popularSelectFuncoesPorSetor();
            renderizar();
            lucide.createIcons();
        }

        function popularSelectNomesTeste(nomeSelecionadoDefault = null) {
            const select = document.getElementById('select-nome-teste');
            select.innerHTML = LISTA_TESTE_70_NOMES.map(nome => `<option value="${nome}" ${nome === nomeSelecionadoDefault ? 'selected' : ''}>${nome}</option>`).join('');
        }

        function popularSelectFuncoesPorSetor(funcaoSelecionadaDefault = null) {
            const select = document.getElementById('novo-funcao');
            select.innerHTML = "";
            for (const [setor, funcoes] of Object.entries(SETORES_E_FUNCOES)) {
                let optgroup = document.createElement('optgroup');
                optgroup.label = `📍 Setor: ${setor}`;
                funcoes.forEach(f => {
                    let option = document.createElement('option');
                    option.value = f;
                    option.textContent = f;
                    if (f === funcaoSelecionadaDefault) {
                        option.selected = true;
                    }
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            }
        }

        function getDataAtualFormatada() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = hoje.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        function verificarDiasConsecutivos(historico) {
            if (!historico || historico.length === 0) return { funcao: "Nenhuma", dias: 0 };
            const ultimaFuncao = historico[historico.length - 1];
            let contador = 0;
            for (let i = historico.length - 1; i >= 0; i--) {
                if (historico[i] === ultimaFuncao) {
                    contador++;
                } else {
                    break;
                }
            }
            return { funcao: ultimaFuncao, dias: contador };
        }

        function tentarAlterarDia(idColab, indexDia, elementoSelect) {
            const numeroDia = indexDia + 1;
            if (numeroDia < diaHoje) {
                const senhaInformada = prompt(`🔒 O Dia ${numeroDia} já passou e está TRANCADO.\nInsira a senha de Administrador para liberar a alteração:`);
                if (senhaInformada !== SENHA_ADM) {
                    alert('❌ Senha incorreta! Alteração negada.');
                    renderizar();
                    if(!document.getElementById('modal-matriz').classList.contains('hidden')) abrirModalMatriz();
                    return;
                } else {
                    alert('✅ Senha correta! Dia liberado para esta alteração.');
                }
            }
            atualizarDiaColab(idColab, indexDia, elementoSelect.value);
        }

        function renderizar() {
            const termoBusca = document.getElementById('input-busca').value.toLowerCase();
            const containerSetores = document.getElementById('container-setores');
            containerSetores.innerHTML = "";

            document.getElementById('kpi-total').innerText = colaboradores.length;
            
            let totalAlertas = 0;
            colaboradores.forEach(c => {
                const status = verificarDiasConsecutivos(c.historicoDias);
                if (status.dias >= 7) totalAlertas++;
            });
            document.getElementById('kpi-alertas').innerText = totalAlertas;

            for (const [setor, funcoesDoSetor] of Object.entries(SETORES_E_FUNCOES)) {
                const colabsDoSetor = colaboradores.filter(c => {
                    const funcAtual = c.historicoDias[diaHoje - 1] || c.historicoDias[c.historicoDias.length - 1];
                    return funcoesDoSetor.includes(funcAtual) && c.nome.toLowerCase().includes(termoBusca);
                });

                let blocoSetor = document.createElement('div');
                blocoSetor.className = "bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl";
                
                let cabecalhoSetor = `
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800 flex-wrap gap-2">
                        <h2 class="text-sm sm:text-base font-bold text-amber-400 flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-amber-500"></i> ${setor}
                        </h2>
                        <div class="flex items-center gap-2">
                            <span class="bg-slate-800 text-slate-300 text-xs px-2.5 py-0.5 rounded-full font-mono">${colabsDoSetor.length} operador${colabsDoSetor.length === 1 ? '' : 'es'}</span>
                            <button onclick="abrirModalAddPorSetor('${setor}')" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-amber-500/30 flex items-center gap-1.5 transition active:scale-95" title="Adicionar Auxiliar neste Setor">
                                <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
                                <span class="hidden sm:inline">Adicionar</span>
                            </button>
                        </div>
                    </div>
                `;

                let conteudoCards = "";
                if (colabsDoSetor.length === 0) {
                    conteudoCards = `<p class="text-xs text-slate-500 italic py-2">Nenhum auxiliar alocado neste setor hoje.</p>`;
                } else {
                    conteudoCards = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">` + colabsDoSetor.map(c => {
                        const status = verificarDiasConsecutivos(c.historicoDias);
                        const emAlerta = status.dias >= 7;

                        return `
                            <div class="bg-slate-900 border ${emAlerta ? 'border-red-500/60 bg-red-950/10' : 'border-slate-800'} rounded-xl p-3.5 shadow transition">
                                <div class="flex flex-col gap-2">
                                    <div>
                                        <div class="flex items-center justify-between gap-2 flex-wrap">
                                            <h3 class="text-xs sm:text-sm font-bold text-slate-100">${c.nome}</h3>
                                            <span class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700">Criado: ${c.dataCriacao || '01/09/2026'}</span>
                                        </div>
                                        ${emAlerta ? `
                                            <div class="mt-1.5 bg-red-500/10 border border-red-500/30 text-red-400 text-[10px] px-2 py-0.5 rounded uppercase tracking-wider font-extrabold flex items-center gap-1 animate-pulse">
                                                <i data-lucide="alert-triangle" class="w-3 h-3"></i> Alerta: ${status.dias} dias seguidos!
                                            </div>
                                        ` : ''}
                                        <div class="text-[11px] text-slate-400 mt-1.5 flex flex-col gap-0.5">
                                            <span>Função Atual:</span>
                                            <div class="flex items-center justify-between gap-1">
                                                <strong class="text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 truncate">${status.funcao}</strong>
                                                <span class="bg-slate-800 px-1.5 py-0.5 rounded text-slate-300 font-mono text-[10px] whitespace-nowrap">${status.dias}d seg.</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="grid grid-cols-3 gap-1 pt-2 border-t border-slate-800/80">
                                        <button onclick="abrirModalEditar(${c.id})" class="bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 text-[10px] font-semibold py-1.5 px-1 rounded-lg border border-blue-500/20 flex items-center justify-center gap-1 transition">
                                            <i data-lucide="edit-3" class="w-3 h-3"></i> Alterar
                                        </button>
                                        <button onclick="abrirHistorico(${c.id})" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-semibold py-1.5 px-1 rounded-lg border border-slate-700 flex items-center justify-center gap-1 transition">
                                            <i data-lucide="calendar" class="w-3 h-3 text-amber-400"></i> Dias
                                        </button>
                                        <button onclick="removerColaborador(${c.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-[10px] font-semibold py-1.5 px-1 rounded-lg border border-red-500/20 flex items-center justify-center gap-1 transition">
                                            <i data-lucide="trash-2" class="w-3 h-3"></i> Excluir
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('') + `</div>`;
                }

                blocoSetor.innerHTML = cabecalhoSetor + conteudoCards;
                containerSetores.appendChild(blocoSetor);
            }

            lucide.createIcons();
        }

        function filtrarColaboradores() { renderizar(); }

        function abrirModalAdd() {
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-titulo').innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> Adicionar Auxiliar`;
            popularSelectNomesTeste();
            popularSelectFuncoesPorSetor();
            document.getElementById('modal-add').classList.remove('hidden');
            lucide.createIcons();
        }

        function abrirModalAddPorSetor(nomeSetor) {
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-titulo').innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> Adicionar em ${nomeSetor}`;
            popularSelectNomesTeste();
            const primeiraFuncaoDoSetor = SETORES_E_FUNCOES[nomeSetor][0];
            popularSelectFuncoesPorSetor(primeiraFuncaoDoSetor);
            document.getElementById('modal-add').classList.remove('hidden');
            lucide.createIcons();
        }

        function abrirModalEditar(id) {
            const colab = colaboradores.find(c => c.id === id);
            if (!colab) return;
            document.getElementById('edit-id').value = colab.id;
            document.getElementById('modal-titulo').innerHTML = `<i data-lucide="edit-3" class="w-4 h-4"></i> Alterar Auxiliar e Função`;
            
            popularSelectNomesTeste(colab.nome);
            const funcaoAtual = colab.historicoDias[diaHoje - 1] || colab.historicoDias[colab.historicoDias.length - 1];
            popularSelectFuncoesPorSetor(funcaoAtual);

            document.getElementById('modal-add').classList.remove('hidden');
            lucide.createIcons();
        }

        function fecharModalAdd() { document.getElementById('modal-add').classList.add('hidden'); }

        function salvarColaborador() {
            const idEdit = document.getElementById('edit-id').value;
            const nomeSelecionado = document.getElementById('select-nome-teste').value;
            const funcaoSelecionada = document.getElementById('novo-funcao').value;

            if (idEdit) {
                const colab = colaboradores.find(c => c.id == idEdit);
                if (colab) {
                    colab.nome = nomeSelecionado;
                    while(colab.historicoDias.length < diaHoje) colab.historicoDias.push(funcaoSelecionada);
                    colab.historicoDias[diaHoje - 1] = funcaoSelecionada;
                }
                fecharModalAdd();
                renderizar();
            } else {
                if (colaboradores.some(c => c.nome === nomeSelecionado)) {
                    alert(`⚠️ O colaborador "${nomeSelecionado}" já está cadastrado.`);
                    return;
                }

                let historicoInicial = [];
                for(let i = 0; i < diaHoje - 1; i++) historicoInicial.push(funcaoSelecionada);
                historicoInicial.push(funcaoSelecionada);

                colaboradores.push({
                    id: Date.now(),
                    nome: nomeSelecionado,
                    dataCriacao: getDataAtualFormatada(),
                    historicoDias: historicoInicial
                });
                fecharModalAdd();
                renderizar();
            }
        }

        function removerColaborador(id) {
            if (confirm('Deseja realmente excluir este auxiliar?')) {
                colaboradores = colaboradores.filter(c => c.id !== id);
                renderizar();
            }
        }

        function abrirHistorico(id) {
            const colab = colaboradores.find(c => c.id === id);
            document.getElementById('titulo-modal-hist').innerText = `Editar Dias (${nomeMesAtual}): ${colab.nome}`;
            while(colab.historicoDias.length < totalDiasDoMes) colab.historicoDias.push(FUNCOES_LOGISTICA[0]);

            const container = document.getElementById('conteudo-historico-dias');
            container.innerHTML = "";
            
            let indicesDias = Array.from({length: totalDiasDoMes}, (_, i) => i);
            indicesDias.sort((a, b) => {
                if ((a + 1) === diaHoje) return -1;
                if ((b + 1) === diaHoje) return 1;
                return 0;
            });

            indicesDias.forEach(i => {
                const func = colab.historicoDias[i] || FUNCOES_LOGISTICA[0];
                const numeroDia = i + 1;
                const eHoje = numeroDia === diaHoje;
                const ePassado = numeroDia < diaHoje;

                let estiloBorda = 'border-slate-800 bg-slate-950';
                let estiloTexto = 'text-slate-300';
                let tagStatus = '';

                if (eHoje) {
                    estiloBorda = 'border-amber-500 bg-amber-500/10 shadow-md ring-1 ring-amber-500/50 sticky top-0 z-20';
                    estiloTexto = 'text-amber-300 font-extrabold';
                    tagStatus = ' ⭐ Hoje (Fixo)';
                } else if (ePassado) {
                    estiloBorda = 'border-red-900/50 bg-red-950/10 opacity-75';
                    estiloTexto = 'text-red-400';
                    tagStatus = ' 🔒';
                }

                let optionsHtml = "";
                for (const [setor, funcoes] of Object.entries(SETORES_E_FUNCOES)) {
                    optionsHtml += `<optgroup label="📍 ${setor}">`;
                    funcoes.forEach(f => {
                        optionsHtml += `<option value="${f}" ${f === func ? 'selected' : ''}>${f}</option>`;
                    });
                    optionsHtml += `</optgroup>`;
                }

                container.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 rounded-xl border ${estiloBorda} gap-2">
                        <span class="text-[11px] font-bold ${estiloTexto} w-28">Dia ${numeroDia}${tagStatus}</span>
                        <select onchange="tentarAlterarDia(${id}, ${i}, this)" class="bg-slate-900 border ${eHoje ? 'border-amber-500/80 text-amber-200' : 'border-slate-800 text-slate-200'} rounded-lg px-2 py-1 text-[11px] focus:outline-none focus:border-amber-500 flex-grow">
                            ${optionsHtml}
                        </select>
                    </div>
                `;
            });
            document.getElementById('modal-historico').classList.remove('hidden');
        }

        function atualizarDiaColab(idColab, indexDia, novaFuncao) {
            const colab = colaboradores.find(c => c.id === idColab);
            if (colab) {
                colab.historicoDias[indexDia] = novaFuncao;
                renderizar();
            }
        }

        function fecharModalHistorico() { document.getElementById('modal-historico').classList.add('hidden'); }

        function abrirModalMatriz() {
            document.getElementById('titulo-matriz-mes').innerHTML = `<i data-lucide="grid" class="w-5 h-5"></i> Matriz Mensal Completa: ${nomeMesAtual} / ${anoAtual} (Hoje: Dia ${diaHoje} ⭐)`;
            const tabelaUnica = document.getElementById('tabela-matriz-unica');
            tabelaUnica.innerHTML = "";

            let thead = `<thead><tr class="bg-slate-900 text-amber-400 border-b border-slate-800 sticky top-0 z-30"><th class="p-2.5 font-bold sticky left-0 bg-slate-900 z-40 min-w-[150px]">Auxiliar</th>`;
            for (let d = 1; d <= totalDiasDoMes; d++) {
                const eHoje = d === diaHoje;
                const ePassado = d < diaHoje;
                
                let classeCabecalho = 'text-slate-300';
                let rotuloDia = `Dia ${d}`;
                if (eHoje) {
                    classeCabecalho = 'text-amber-400 bg-amber-500/20 font-extrabold border-b-2 border-amber-400';
                    rotuloDia = `⭐ Dia ${d} (Hoje)`;
                } else if (ePassado) {
                    classeCabecalho = 'text-red-400 opacity-70';
                    rotuloDia = `Dia ${d} 🔒`;
                }

                thead += `<th class="p-2.5 text-center font-semibold min-w-[120px] ${classeCabecalho}">${rotuloDia}</th>`;
            }
            thead += `</tr></thead>`;

            let tbody = `<tbody>`;
            colaboradores.forEach(c => {
                while(c.historicoDias.length < totalDiasDoMes) c.historicoDias.push("-");
                tbody += `<tr class="border-b border-slate-800/60 hover:bg-slate-900/30"><td class="p-2.5 font-bold text-slate-200 sticky left-0 bg-slate-900 z-20 border-r border-slate-800">${c.nome}</td>`;
                
                for (let d = 0; d < totalDiasDoMes; d++) {
                    const funcDia = c.historicoDias[d] || "-";
                    const numeroDia = d + 1;
                    const eHoje = numeroDia === diaHoje;
                    const ePassado = numeroDia < diaHoje;

                    let estiloCelulaSelect = 'bg-slate-950 border-slate-800 text-slate-300';
                    if (eHoje) {
                        estiloCelulaSelect = 'bg-amber-950/40 border-amber-500 text-amber-200 font-bold ring-2 ring-amber-500/60';
                    } else if (ePassado) {
                        estiloCelulaSelect = 'bg-red-950/10 border-red-900/40 text-red-300/80';
                    }

                    let optionsHtml = `<option value="" ${funcDia === "-" ? "selected" : ""}>-</option>`;
                    for (const [sName, funcoes] of Object.entries(SETORES_E_FUNCOES)) {
                        optionsHtml += `<optgroup label="📍 ${sName}">`;
                        funcoes.forEach(f => {
                            optionsHtml += `<option value="${f}" ${f === funcDia ? 'selected' : ''}>${f}</option>`;
                        });
                        optionsHtml += `</optgroup>`;
                    }

                    tbody += `<td class="p-1.5 text-center"><select onchange="tentarAlterarDia(${c.id}, ${d}, this)" class="border rounded-lg p-1 text-[10px] focus:outline-none focus:border-amber-500 w-full truncate ${estiloCelulaSelect}">${optionsHtml}</select></td>`;
                }
                tbody += `</tr>`;
            });
            tbody += `</tbody>`;

            tabelaUnica.innerHTML = thead + tbody;
            document.getElementById('modal-matriz').classList.remove('hidden');
            lucide.createIcons();

            setTimeout(() => {
                const wrapper = document.querySelector('#modal-matriz .overflow-auto');
                const celulaHoje = wrapper.querySelector('th.bg-amber-500\\/20');
                if (celulaHoje) {
                    wrapper.scrollLeft = celulaHoje.offsetLeft - 150;
                }
            }, 100);
        }

        function fecharModalMatriz() { document.getElementById('modal-matriz').classList.add('hidden'); renderizar(); }

        window.onload = init;
    </script>
</body>
</html>
