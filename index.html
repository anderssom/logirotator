<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>LogiRotator - Controle de Colaboradores</title>
    
    <!-- Tailwind CSS (Versão estável via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900">

    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-600">LogiRotator</h1>
            <p class="text-gray-600">Painel de Gestão e Escala de Colaboradores</p>
        </header>

        <!-- Status de Carregamento / Erros -->
        <div id="mensagem-status" class="mb-4 text-sm font-medium"></div>

        <!-- Tabela de Colaboradores -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Função</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Escala</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Horário</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">DSR</th>
                    </tr>
                </thead>
                <tbody id="tabela-colaboradores" class="bg-white divide-y divide-gray-200">
                    <!-- Os dados serão injetados aqui via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Conexão e Lógica -->
    <script>
        // Substitua pelas suas credenciais reais do Supabase
        const SUPABASE_URL = 'https://usnxltlieybmdcococvz.supabase.co';
        const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_PUBLICA_AQUI'; 

        // Inicializa o cliente do Supabase
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarColaboradores() {
            const statusEl = document.getElementById('mensagem-status');
            const tabelaEl = document.getElementById('tabela-colaboradores');

            statusEl.textContent = 'A carregar colaboradores...';
            statusEl.className = 'mb-4 text-sm font-medium text-blue-600';

            try {
                // CORREÇÃO DA CONSULTA: Selecionando explicitamente as colunas corretas semânticas do PostgREST
                const { data, error } = await _supabase
                    .from('colaboradores')
                    .select('nome, funcao_principal, escala, horario, dsr');

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    statusEl.textContent = 'Nenhum colaborador encontrado.';
                    statusEl.className = 'mb-4 text-sm font-medium text-yellow-600';
                    return;
                }

                statusEl.textContent = `Total de colaboradores carregados: ${data.length}`;
                statusEl.className = 'mb-4 text-sm font-medium text-green-600';

                // Renderiza os dados na tabela
                tabelaEl.innerHTML = '';
                data.forEach(collab => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${collab.nome || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${collab.funcao_principal || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${collab.escala || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${collab.horario || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${collab.dsr || '-'}</td>
                    `;
                    tabelaEl.appendChild(tr);
                });

            } catch (err) {
                console.error('Erro detalhado:', err);
                statusEl.textContent = `Erro ao carregar dados: ${err.message}`;
                statusEl.className = 'mb-4 text-sm font-medium text-red-600';
            }
        }

        // Executa a função ao carregar a página
        document.addEventListener('DOMContentLoaded', carregarColaboradores);
    </script>
</body>
</html>
